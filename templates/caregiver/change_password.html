{% extends 'base.html' %}
{% block content %}

<div style="display:flex; justify-content:space-between; margin-bottom:20px;">
    <h2>🔑 Change Password — {{ resident.full_name }}</h2>
    <a href="{% url 'caregiver_resident_detail' resident.pk %}" class="btn btn-primary">← Back</a>
</div>

<div class="card" style="max-width:500px;">

    <!-- Current Login Info -->
    <div style="background:#e8f4fd; padding:16px; border-radius:8px; margin-bottom:20px;">
        <p><b>👤 Username:</b>
            <span style="font-family:monospace; font-size:16px; color:#1a73e8;">
                {{ resident.user.username }}
            </span>
        </p>
        <p style="margin-top:8px; font-size:13px; color:#555;">
            Share the new password with the resident after changing.
        </p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <label>New Password</label>
        <div style="position:relative;">
            <input type="text" name="new_password" id="newPassField"
                   required placeholder="Enter new password (min 6 chars)"
                   style="padding-right:80px;">
            <button type="button" onclick="generatePassword()"
                    style="position:absolute; right:8px; top:50%; transform:translateY(-50%);
                           background:#1a73e8; color:white; border:none; border-radius:4px;
                           padding:4px 8px; font-size:12px; cursor:pointer;">
                Auto Generate
            </button>
        </div>

        <button type="submit" class="btn btn-success" style="width:100%; margin-top:10px;">
            🔑 Change Password
        </button>
    </form>
</div>

<script>
function generatePassword() {
    const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
    let password = '';
    for (let i = 0; i < 8; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    document.getElementById('newPassField').value = password;
}
</script>

{% endblock %}
