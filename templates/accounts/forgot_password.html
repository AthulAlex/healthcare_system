{% extends 'base.html' %}
{% block content %}

<div style="max-width:460px; margin:60px auto;">
    <div class="card">
        <h2 style="text-align:center; margin-bottom:8px; color:#1a73e8;">
            🔑 Forgot Password
        </h2>
        <p style="text-align:center; color:#777; margin-bottom:24px; font-size:14px;">
            Enter your username and set a new password
        </p>

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" required
                   placeholder="Enter your username">

            <label>New Password</label>
            <input type="password" name="new_password" required
                   placeholder="Enter new password (min 6 chars)">

            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required
                   placeholder="Repeat new password">

            <!-- Password strength hint -->
            <div style="background:#f0f4f8; padding:12px; border-radius:8px;
                        margin-bottom:16px; font-size:13px; color:#555;">
                💡 <b>Tips for a strong password:</b><br>
                • At least 6 characters<br>
                • Mix letters and numbers<br>
                • Avoid using your name or birthdate
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">
                🔑 Reset Password
            </button>
        </form>

        <div style="text-align:center; margin-top:16px;">
            <a href="{% url 'login' %}">← Back to Login</a>
        </div>
    </div>
</div>

{% endblock %}
